<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Error {{ code }} — NexusFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="text-align:center;max-width:420px;padding:40px 20px;">
    <div style="font-size:5rem;font-weight:800;letter-spacing:-0.05em;background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;">{{ code }}</div>
    <h2 style="margin-bottom:12px;">{{ 'Access Denied' if code == 403 else 'Page Not Found' if code == 404 else 'Something went wrong' }}</h2>
    <p style="margin-bottom:28px;">{{ message }}</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <a href="/dashboard" class="btn btn-primary">Go to Dashboard</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
  </div>
</body>
</html>
